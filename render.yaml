services:
  - type: pserv
    name: postgres
    env: docker
    plan: free
    dockerCommand: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    envVars:
      - key: POSTGRES_DB
        value: nakama
      - key: POSTGRES_PASSWORD
        value: localdb
    disk:
      name: data
      mountPath: /var/lib/postgresql/data

  - type: pserv
    name: nakama
    env: docker
    plan: free
    buildCommand: ""  # Replace with actual build command if needed
    startCommand: >
      /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
      exec /nakama/nakama --name TheousKai --config /nakama/data/local.yml --socket.server_key "TheousKai" --database.address postgres:localdb@postgres:5432/nakama
    envVars:
      - key: DATABASE_URL
        value: postgres:localdb@postgres:5432/nakama
    healthCheckPath: /nakama/nakama healthcheck
